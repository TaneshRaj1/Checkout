name: Run Pytest    
on: push    
jobs:    
  run-pytest:    
    runs-on: ubuntu-latest    
    steps:    
      - name: Checkout repository 
        uses: actions/checkout@v7.0.1  

      - name: Set up Python    
        uses: actions/setup-python@v5   
        with:    
          python-version: '3.12'    

      - name: Install pytest  
        run: |    
          python -m pip install --upgrade pip    
          pip install pytest    

      - name: Run Pytest    
        run: |    
           python -m pytest
